<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <!-- Background Night Sky Gradient -->
    <linearGradient id="gothicBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0716" />
      <stop offset="25%" stop-color="#140a28" />
      <stop offset="60%" stop-color="#1d1038" />
      <stop offset="85%" stop-color="#0e061d" />
      <stop offset="100%" stop-color="#05020a" />
    </linearGradient>

    <!-- Radial Nebula Glows -->
    <radialGradient id="lanternNebula1" cx="30%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3b0764" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="lanternNebula2" cx="70%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#581c87" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Chamber Glow Gradient -->
    <linearGradient id="glassGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#9333ea" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.8" />
    </linearGradient>

    <!-- Core Flame Gradient -->
    <radialGradient id="flameCore" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f5d0fe" />
      <stop offset="70%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <!-- Iron Texture Gradient -->
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181325" />
      <stop offset="30%" stop-color="#322a45" />
      <stop offset="70%" stop-color="#1f1830" />
      <stop offset="100%" stop-color="#100b1a" />
    </linearGradient>

    <!-- Crystal Pendant Gradient -->
    <linearGradient id="crystalPendantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#e9d5ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.95" />
    </linearGradient>

    <!-- Bloom & Glow Filters -->
    <filter id="lanternGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="blur1" />
      <feGaussianBlur stdDeviation="9" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShimmer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Chain Link Unit Pattern -->
    <pattern id="chainPattern" width="16" height="32" patternUnits="userSpaceOnUse">
      <!-- Vertical Link -->
      <rect x="5" y="0" width="6" height="20" rx="3" fill="none" stroke="#2a203d" stroke-width="2.5" />
      <rect x="6" y="2" width="4" height="16" rx="2" fill="none" stroke="#4c3d69" stroke-width="1" />
      <!-- Horizontal Crossing Link -->
      <line x1="8" y1="16" x2="8" y2="32" stroke="#1c142c" stroke-width="4.5" stroke-linecap="round" />
      <line x1="8" y1="18" x2="8" y2="30" stroke="#382b52" stroke-width="2" />
    </pattern>

    <!-- Ivy Leaf Silhouette -->
    <g id="ivyLeaf">
      <path d="M 0,0 C -8,-10 -18,-6 -14,8 C -10,18 0,24 0,24 C 0,24 10,18 14,8 C 18,-6 8,-10 0,0 Z" fill="#2d2247" stroke="#4c3a70" stroke-width="0.8" />
      <line x1="0" y1="2" x2="0" y2="20" stroke="#5b4885" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Detailed Gothic Iron Lantern Component -->
    <g id="gothicLantern">
      <!-- Outer Radial Aura -->
      <circle cx="0" cy="80" r="140" fill="#a855f7" opacity="0.32" filter="url(#lanternGlow)" />
      <circle cx="0" cy="80" r="70" fill="#f5d0fe" opacity="0.45" filter="url(#lanternGlow)" />

      <!-- Hanging Top Loop Ring -->
      <circle cx="0" cy="-60" r="14" fill="none" stroke="url(#ironGrad)" stroke-width="6" />
      <circle cx="0" cy="-60" r="14" fill="none" stroke="#52416f" stroke-width="1.5" />

      <!-- Lantern Roof / Tiered Gothic Cap -->
      <path d="M -8,-48 L 8,-48 L 14,-32 L 32,-16 L 46,0 L -46,0 L -32,-16 L -14,-32 Z" fill="url(#ironGrad)" stroke="#453461" stroke-width="1.5" />
      <!-- Roof Ridge Ornaments / Crown Spikes -->
      <path d="M -46,0 Q -35,-8 -24,0 Q -12,-8 0,0 Q 12,-8 24,0 Q 35,-8 46,0" fill="none" stroke="#251a38" stroke-width="3" />

      <!-- Glass Lantern Body Glow -->
      <g filter="url(#softShimmer)">
        <!-- Hexagonal Glass Chamber -->
        <polygon points="-40,4 40,4 34,140 -34,140" fill="url(#glassGlow)" />
        <!-- Inner Ethereal Glow Core -->
        <ellipse cx="0" cy="85" rx="28" ry="42" fill="url(#flameCore)" />
        <!-- Floating Firefly Particles inside Glass -->
        <circle cx="-12" cy="65" r="2.5" fill="#ffffff" opacity="0.9" filter="url(#lanternGlow)" />
        <circle cx="14" cy="90" r="3" fill="#ffffff" opacity="0.9" filter="url(#lanternGlow)" />
        <circle cx="0" cy="50" r="2" fill="#ffffff" opacity="0.85" />
        <circle cx="-8" cy="110" r="2" fill="#ffffff" opacity="0.75" />
      </g>

      <!-- Gothic Arched Window Metal Ribs & Frame -->
      <g>
        <!-- Outer Frame Pillars -->
        <rect x="-42" y="2" width="6" height="140" rx="2" fill="url(#ironGrad)" stroke="#3e2d59" stroke-width="1" />
        <rect x="36" y="2" width="6" height="140" rx="2" fill="url(#ironGrad)" stroke="#3e2d59" stroke-width="1" />
        <rect x="-16" y="2" width="4.5" height="140" fill="url(#ironGrad)" stroke="#302247" stroke-width="0.8" />
        <rect x="11.5" y="2" width="4.5" height="140" fill="url(#ironGrad)" stroke="#302247" stroke-width="0.8" />

        <!-- Arched Tracery at Top of Glass -->
        <path d="M -40,32 Q -28,8 -16,32 Q 0,8 14,32 Q 26,8 38,32" fill="none" stroke="url(#ironGrad)" stroke-width="3" />
        <path d="M -40,32 Q -28,14 -16,32 Q 0,14 14,32 Q 26,14 38,32" fill="none" stroke="#554275" stroke-width="1" />

        <!-- Lower Arch Support -->
        <path d="M -40,118 Q -28,134 -16,118 Q 0,134 14,118 Q 26,134 38,118" fill="none" stroke="url(#ironGrad)" stroke-width="2.5" />
      </g>

      <!-- Lantern Base Platform -->
      <path d="M -44,140 L 44,140 L 36,156 L 16,166 L -16,166 L -36,156 Z" fill="url(#ironGrad)" stroke="#453461" stroke-width="1.5" />
      <rect x="-38" y="142" width="76" height="4" fill="#52416f" opacity="0.6" />

      <!-- Base Pendant Mount -->
      <polygon points="-6,166 6,166 0,178" fill="url(#ironGrad)" />

      <!-- Dangling Crystal Prism Pendant -->
      <g transform="translate(0, 184)">
        <!-- Crystal Facets -->
        <polygon points="0,0 8,12 0,28 -8,12" fill="url(#crystalPendantGrad)" stroke="#ffffff" stroke-width="1" filter="url(#lanternGlow)" />
        <polygon points="0,0 0,28 8,12" fill="#ffffff" opacity="0.6" />
        <!-- Bottom Teardrop Spark -->
        <circle cx="0" cy="14" r="2" fill="#ffffff" filter="url(#lanternGlow)" />
      </g>

      <!-- Starlight Starburst Flares around the core -->
      <g filter="url(#lanternGlow)">
        <polygon points="0,45 2,75 0,80 -2,75" fill="#ffffff" opacity="0.95" />
        <polygon points="0,115 2,85 0,80 -2,85" fill="#ffffff" opacity="0.95" />
        <polygon points="-35,80 -5,82 0,80 -5,78" fill="#ffffff" opacity="0.95" />
        <polygon points="35,80 5,82 0,80 5,78" fill="#ffffff" opacity="0.95" />
      </g>
    </g>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1080" height="1920" fill="url(#gothicBgGrad)" />

  <!-- Atmospheric Cosmic Purple Glows -->
  <rect width="1080" height="1920" fill="url(#lanternNebula1)" />
  <rect width="1080" height="1920" fill="url(#lanternNebula2)" />

  <!-- Shimmering Stardust & Sparkle Field -->
  <g opacity="0.75" filter="url(#softShimmer)">
    <circle cx="120" cy="480" r="2" fill="#ffffff" />
    <circle cx="280" cy="620" r="3" fill="#e9d5ff" />
    <circle cx="450" cy="380" r="2" fill="#ffffff" />
    <circle cx="680" cy="560" r="2.5" fill="#f5d0fe" />
    <circle cx="890" cy="420" r="3" fill="#ffffff" />
    <circle cx="980" cy="740" r="2" fill="#d8b4fe" />
    <circle cx="160" cy="1120" r="2.5" fill="#ffffff" />
    <circle cx="340" cy="980" r="2" fill="#e9d5ff" />
    <circle cx="580" cy="1280" r="3" fill="#ffffff" />
    <circle cx="790" cy="1140" r="2" fill="#f5d0fe" />
    <circle cx="920" cy="1360" r="2.5" fill="#ffffff" />
    <circle cx="240" cy="1540" r="2" fill="#d8b4fe" />
    <circle cx="520" cy="1680" r="3" fill="#ffffff" />
    <circle cx="840" cy="1720" r="2" fill="#e9d5ff" />
    <circle cx="410" cy="1840" r="2.5" fill="#ffffff" />
  </g>

  <!-- Ivy Vines Cascading from Top Ceiling -->
  <g opacity="0.85">
    <!-- Top Left Vine -->
    <path d="M 60,-20 Q 90,80 130,220 Q 160,340 180,480" fill="none" stroke="#201733" stroke-width="4" />
    <use href="#ivyLeaf" transform="translate(75, 40) rotate(25) scale(1.1)" />
    <use href="#ivyLeaf" transform="translate(100, 110) rotate(-40) scale(1.2)" />
    <use href="#ivyLeaf" transform="translate(125, 180) rotate(50) scale(1)" />
    <use href="#ivyLeaf" transform="translate(145, 260) rotate(-20) scale(0.9)" />
    <use href="#ivyLeaf" transform="translate(165, 360) rotate(35) scale(0.85)" />

    <!-- Top Right Vine -->
    <path d="M 980,-20 Q 940,100 900,240 Q 870,380 840,520" fill="none" stroke="#201733" stroke-width="4" />
    <use href="#ivyLeaf" transform="translate(965, 50) rotate(-30) scale(1.1)" />
    <use href="#ivyLeaf" transform="translate(935, 130) rotate(45) scale(1.3)" />
    <use href="#ivyLeaf" transform="translate(910, 220) rotate(-35) scale(1)" />
    <use href="#ivyLeaf" transform="translate(880, 320) rotate(25) scale(0.9)" />
    <use href="#ivyLeaf" transform="translate(855, 420) rotate(-40) scale(0.8)" />
  </g>

  <!-- ================= LAYER 1: DISTANT BACKGROUND LANTERNS (Small, Deep Atmospheric Glow) ================= -->
  <g opacity="0.55">
    <!-- Lantern 1 (Top Center-Left) -->
    <line x1="420" y1="0" x2="420" y2="160" stroke="#251a38" stroke-width="2.5" stroke-dasharray="6 3" />
    <use href="#gothicLantern" transform="translate(420, 220) scale(0.48)" />

    <!-- Lantern 2 (Center High) -->
    <line x1="560" y1="0" x2="560" y2="240" stroke="#251a38" stroke-width="2.5" stroke-dasharray="6 3" />
    <use href="#gothicLantern" transform="translate(560, 300) scale(0.55)" />

    <!-- Lantern 3 (Right High) -->
    <line x1="820" y1="0" x2="820" y2="340" stroke="#251a38" stroke-width="2.5" stroke-dasharray="6 3" />
    <use href="#gothicLantern" transform="translate(820, 400) scale(0.52)" />

    <!-- Lantern 4 (Left Mid-Low) -->
    <line x1="280" y1="0" x2="280" y2="680" stroke="#251a38" stroke-width="2.5" stroke-dasharray="6 3" />
    <use href="#gothicLantern" transform="translate(280, 740) scale(0.5)" />

    <!-- Lantern 5 (Center-Low) -->
    <line x1="380" y1="0" x2="380" y2="920" stroke="#251a38" stroke-width="2.5" stroke-dasharray="6 3" />
    <use href="#gothicLantern" transform="translate(380, 980) scale(0.58)" />

    <!-- Lantern 6 (Far Bottom Right) -->
    <line x1="960" y1="0" x2="960" y2="620" stroke="#251a38" stroke-width="2.5" stroke-dasharray="6 3" />
    <use href="#gothicLantern" transform="translate(960, 680) scale(0.5)" />
  </g>

  <!-- ================= LAYER 2: MIDGROUND LANTERNS ================= -->
  <g opacity="0.85">
    <!-- Top-Left High Lantern -->
    <line x1="40" y1="0" x2="40" y2="260" stroke="#35264f" stroke-width="3.5" stroke-dasharray="8 4" />
    <use href="#gothicLantern" transform="translate(40, 330) scale(0.8)" />

    <!-- Upper-Left Lantern -->
    <line x1="340" y1="0" x2="340" y2="360" stroke="#35264f" stroke-width="3.5" stroke-dasharray="8 4" />
    <use href="#gothicLantern" transform="translate(340, 440) scale(0.85)" />

    <!-- Upper-Right Medium Lantern -->
    <line x1="680" y1="0" x2="680" y2="400" stroke="#35264f" stroke-width="3.5" stroke-dasharray="8 4" />
    <use href="#gothicLantern" transform="translate(680, 490) scale(0.9)" />

    <!-- Mid-Bottom Left Lantern -->
    <line x1="200" y1="0" x2="200" y2="820" stroke="#35264f" stroke-width="3.5" stroke-dasharray="8 4" />
    <use href="#gothicLantern" transform="translate(200, 910) scale(0.82)" />

    <!-- Bottom Left Low Lantern -->
    <line x1="110" y1="0" x2="110" y2="920" stroke="#35264f" stroke-width="3.5" stroke-dasharray="8 4" />
    <use href="#gothicLantern" transform="translate(110, 1010) scale(0.78)" />

    <!-- Bottom Center-Right Lantern -->
    <line x1="740" y1="0" x2="740" y2="960" stroke="#35264f" stroke-width="3.5" stroke-dasharray="8 4" />
    <use href="#gothicLantern" transform="translate(740, 1060) scale(0.88)" />

    <!-- Bottom Deep Right Lantern -->
    <line x1="930" y1="0" x2="930" y2="880" stroke="#35264f" stroke-width="3.5" stroke-dasharray="8 4" />
    <use href="#gothicLantern" transform="translate(930, 980) scale(0.85)" />
  </g>

  <!-- ================= LAYER 3: FOREGROUND HERO LANTERNS (Matches Uploaded Reference Image) ================= -->
  <g>
    <!-- Giant Center-Hero Gothic Lantern on Thick Wrought-Iron Chain -->
    <line x1="490" y1="0" x2="490" y2="600" stroke="#1d142b" stroke-width="7" />
    <line x1="490" y1="0" x2="490" y2="600" stroke="#483663" stroke-width="3.5" stroke-dasharray="14 6" />
    <use href="#gothicLantern" transform="translate(490, 720) scale(1.55)" />

    <!-- Large Upper-Left Foreground Lantern -->
    <line x1="120" y1="0" x2="120" y2="480" stroke="#1d142b" stroke-width="6" />
    <line x1="120" y1="0" x2="120" y2="480" stroke="#483663" stroke-width="3" stroke-dasharray="12 5" />
    <use href="#gothicLantern" transform="translate(120, 590) scale(1.3)" />

    <!-- Large Right Foreground Gothic Lantern -->
    <line x1="860" y1="0" x2="860" y2="580" stroke="#1d142b" stroke-width="6.5" />
    <line x1="860" y1="0" x2="860" y2="580" stroke="#483663" stroke-width="3.2" stroke-dasharray="13 5" />
    <use href="#gothicLantern" transform="translate(860, 700) scale(1.4)" />

    <!-- Massive Top-Right Corner Framing Lantern -->
    <line x1="990" y1="0" x2="990" y2="180" stroke="#1d142b" stroke-width="7" />
    <line x1="990" y1="0" x2="990" y2="180" stroke="#483663" stroke-width="3.5" stroke-dasharray="14 6" />
    <use href="#gothicLantern" transform="translate(990, 290) scale(1.6)" />
  </g>

  <!-- Sparkling Cross-Star Flares & Prismatic Diamond Shimmers -->
  <g filter="url(#lanternGlow)">
    <g transform="translate(490, 800) scale(0.65)">
      <polygon points="0,-60 4,-12 0,-4 -4,-12" fill="#ffffff" />
      <polygon points="0,60 4,12 0,4 -4,12" fill="#ffffff" />
      <polygon points="-60,0 -12,4 -4,0 -12,-4" fill="#ffffff" />
      <polygon points="60,0 12,4 4,0 12,-4" fill="#ffffff" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
    </g>
    <g transform="translate(120, 670) scale(0.55)">
      <polygon points="0,-60 4,-12 0,-4 -4,-12" fill="#ffffff" />
      <polygon points="0,60 4,12 0,4 -4,12" fill="#ffffff" />
      <polygon points="-60,0 -12,4 -4,0 -12,-4" fill="#ffffff" />
      <polygon points="60,0 12,4 4,0 12,-4" fill="#ffffff" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
    </g>
    <g transform="translate(860, 780) scale(0.55)">
      <polygon points="0,-60 4,-12 0,-4 -4,-12" fill="#ffffff" />
      <polygon points="0,60 4,12 0,4 -4,12" fill="#ffffff" />
      <polygon points="-60,0 -12,4 -4,0 -12,-4" fill="#ffffff" />
      <polygon points="60,0 12,4 4,0 12,-4" fill="#ffffff" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
    </g>
  </g>
</svg>

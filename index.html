  <body>
    <div id="root">
      <style>
        .initial-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #0d061a;
          color: #ffffff;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .initial-splash-logo {
          width: 80px;
          height: 80px;
          margin-bottom: 20px;
          filter: drop-shadow(0 0 25px rgba(236,72,153,0.8));
          animation: splashPulse 2s infinite ease-in-out;
        }
        .initial-splash-title {
          font-size: 28px;
          font-weight: 900;
          letter-spacing: -0.5px;
          background: linear-gradient(to right, #ffffff, #f3e8ff, #fbcfe8);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .initial-splash-sub {
          font-size: 11px;
          font-weight: 900;
          letter-spacing: 0.35em;
          color: #f472b6;
          margin-top: 6px;
        }
        .initial-splash-loader {
          width: 180px;
          height: 4px;
          background: rgba(88, 28, 135, 0.4);
          border-radius: 999px;
          margin-top: 30px;
          overflow: hidden;
          position: relative;
        }
        .initial-splash-bar {
          position: absolute;
          top: 0;
          left: 0;
          bottom: 0;
          width: 50%;
          background: linear-gradient(90deg, #9333ea, #ec4899, #f59e0b);
          border-radius: 999px;
          animation: splashBar 1.2s infinite ease-in-out;
        }
        @keyframes splashPulse {
          0%, 100% { transform: scale(1); opacity: 0.9; }
          50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes splashBar {
          0% { left: -50%; width: 30%; }
          50% { left: 25%; width: 60%; }
          100% { left: 100%; width: 30%; }
        }
      </style>
      <div class="initial-splash">
        <svg class="initial-splash-logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="26" fill="url(#saturnGradient)" />
          <ellipse cx="60" cy="60" rx="52" ry="15" stroke="url(#ringGradient)" stroke-width="4.5" transform="rotate(-22 60 60)" />
          <defs>
            <radialGradient id="saturnGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(50 50) rotate(45) scale(32)">
              <stop stop-color="#fef08a" />
              <stop offset="0.5" stop-color="#ec4899" />
              <stop offset="1" stop-color="#581c87" />
            </radialGradient>
            <linearGradient id="ringGradient" x1="0" y1="0" x2="120" y2="120">
              <stop stop-color="#38bdf8" />
              <stop offset="0.5" stop-color="#f472b6" />
              <stop offset="1" stop-color="#fbbf24" />
            </linearGradient>
          </defs>
        </svg>
        <div class="initial-splash-title">MIKROKOSMOS</div>
        <div class="initial-splash-sub">FANSUB</div>
        <div class="initial-splash-loader">
          <div class="initial-splash-bar"></div>
        </div>
      </div>
